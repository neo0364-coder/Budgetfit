<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="내 예산과 생활 패턴에 맞춘 홈트·헬스 운동과 저렴한 집밥 식단을 짜 주는 무료 앱" />
    <meta name="theme-color" content="#1fae67" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="알뜰핏" />
    <meta property="og:title" content="알뜰핏 - 예산 맞춤 운동·식단" />
    <meta property="og:description" content="일주일 식비 5만 원으로 운동과 식단을 한 번에! 무료로 내 플랜을 받아보세요." />
    <meta property="og:image" content="./icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>알뜰핏</title>
    <script>
      // 저장된 테마를 그리기 전에 적용해서 화면이 깜빡이지 않게 한다
      try {
        var t = JSON.parse(localStorage.getItem('budgetfit:theme') || '"light"');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
